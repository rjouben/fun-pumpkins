apiVersion: harvesterhci.io/v1beta1
kind: VirtualMachineTemplate
metadata:
  name: my-harvester-vm-template
  namespace: default # Or your desired namespace
spec:
  description: "A base template for Harvester VMs with Ubuntu"
  template:
    spec:
      cpu:
        cores: 2
      memory: 4Gi
      image: "ubuntu-24" # Replace with your Harvester image name
      volumes:
        - name: rootdisk
          volumeClaimTemplate:
            spec:
              accessModes: [ "ReadWriteOnce" ]
              resources:
                requests:
                  storage: 50Gi
              storageClassName: "longhorn" # Or your preferred storage class
      networks:
        - name: default
          networkName: "harvester-mgmt" # Or your management network
      cloudInit:
        userData: |
          #cloud-config
          hostname: my-vm
          users:
            - name: admin
              sudo: ALL=(ALL) NOPASSWD:ALL
              ssh_authorized_keys:
                - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAP+tW85n9PNJCxd9dfbwq4Afgkn8pYY+qoiaCA+7gD2